# synthetic_config.yaml (Option B - Minimal, production-ready)
meta:
  project_name: "PhantomScalp Synthetic Data Generator"
  config_version: "v1.0.0"

global:
  seed: 12345
  timezone: "UTC"
  # Default simulation window (engines may override)
  default_start_ts: "2025-12-01T00:00:00Z"
  default_end_ts:   "2025-12-01T01:00:00Z"
  max_workers: 4
  environment: "dev"    # dev | staging | prod

rows:
  spot:                      10000
  orderbook_l1:             300000
  orderbook_l2:             250000
  orderbook_l3:             300000
  ticks_trades:              50000
  ticks_orderflow:          500000
  options_chain:             5000
  options_iv_surface:        5000
  options_oi:                5000
  greeks_primary:            5000
  greeks_flow:               5000
  crossasset_correlation:   10000
  crossasset_funding:        5000
   
  fut_open_interest:        50000
  fut_funding_rate:         30000
  fut_basis_structure:      40000
  fut_positioning:          40000
  fut_liquidation_pressure: 60000
  fut_volume_flow:          50000
  fut_leverage_metrics:     40000
  fut_derivatives_regime:   30000

paths:
  base: "synthetic_data_generator/outputs"

  spot:               "spot"
  orderbook_l1:       "orderbook/l1"
  orderbook_l2:       "orderbook/l2"
  orderbook_l3:       "orderbook/l3"
  ticks_trades:       "ticks_and_orderflow/trades"
  ticks_orderflow:    "ticks_and_orderflow/orderflow"
  options_chain:      "options/chain"
  options_iv_surface: "options/iv_surface"
  options_oi:         "options/oi"
  greeks_primary:     "greeks/primary"
  greeks_flow:        "greeks/flow"
  crossasset_corr:    "crossasset/correlation"
  crossasset_funding: "crossasset/funding"

  fut_open_interest:        "futures/open_interest"
  fut_funding_rate:         "futures/funding_rate"
  fut_basis_structure:      "futures/basis_structure"
  fut_positioning:          "futures/positioning"
  fut_liquidation_pressure: "futures/liquidation_pressure"
  fut_volume_flow:          "futures/volume_flow"
  fut_leverage_metrics:     "futures/leverage_metrics"
  fut_derivatives_regime:   "futures/derivatives_regime"

  meta: "meta"

# Partitioning (DATE-ONLY, locked)
partitioning:
  enabled: true
  columns: ["date"]                # daily partitioning only
  sharding:
    enabled: true
    max_rows_per_file: 200000
    min_rows_per_file: 10000
    combine_small_parts: false
    temp_suffix: ".tmp_shard"
  compression: "snappy"
  engine: "pyarrow"

# Parquet writer / IO behaviour
writer:
  atomic_write: true
  index: false
  compression: "snappy"
  file_naming:
    part_prefix: "part"
    part_format: "{:05d}"

# Sharder (post-processing) basic settings
sharder:
  enabled: true
  delete_sources_after_shard: false
  coalesce_threshold: 3
  temp_dir_prefix: ".tmp_shard_work"

# Validation settings
validation:
  enable_schema_validation: true
  timestamp_tz_required: true
  dtype_strict: true
  max_null_ratio: 0.0
  schema_version: "v1"

# Engines: minimal toggles only (no hyperparameters)
engines:
  spot:
    enabled: true
  orderbook_l1:
    enabled: true
  orderbook_l2:
    enabled: true
  orderbook_l3:
    enabled: true
  ticks_trades:
    enabled: true
  ticks_orderflow:
    enabled: true
  options_chain:
    enabled: true
  options_iv_surface:
    enabled: true
  options_oi:
    enabled: true
  greeks_primary:
    enabled: true
  greeks_flow:
    enabled: true
  crossasset_correlation:
    enabled: true
  crossasset_funding:
    enabled: true
    
  fut_open_interest:
    enabled: true
  fut_funding_rate:
    enabled: true
  fut_basis_structure:
    enabled: true
  fut_positioning:
    enabled: true
  fut_liquidation_pressure:
    enabled: true
  fut_volume_flow:
    enabled: true
  fut_leverage_metrics:
    enabled: true
  fut_derivatives_regime:
    enabled: true

manifest:
  write_manifest: true
  include_checksums: true
  include_config_hash: true
  manifest_name: "_manifest.json"

retention:
  retain_days_raw: 3
  retain_days_parquet: 30
  archive_to: "archive/"

logging:
  level: "INFO"
  log_dir: "logs/"
